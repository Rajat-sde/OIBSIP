<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="A simple, responsive temperature converter web app.">
        <title>Temperature Converter | Task 3</title>

        <!-- External Stylesheet -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- Main Container -->
        <main class="converter-card">
            <header class="card-header">
                <h1>Temperature Converter</h1>
                <p>Convert values seamlessly between Celsius, Fahrenheit, and
                    Kelvin.</p>
            </header>

            <!-- Converter Form -->
            <form id="converterForm" class="converter-form" novalidate>

                <!-- Input Value Field -->
                <div class="form-group">
                    <label for="temperatureInput">Degrees</label>
                    <input
                        type="number"
                        id="temperatureInput"
                        placeholder="Enter value"
                        step="any"
                        required>
                </div>

                <!-- Unit Dropdown -->
                <div class="form-group">
                    <label for="unitSelect">Type</label>
                    <select id="unitSelect">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <!-- Convert Action Button -->
                <button type="submit" id="convertBtn"
                    class="btn">Convert</button>
            </form>

            <!-- Error Message Display -->
            <div id="errorMessage" class="error-message"
                aria-live="polite"></div>

            <!-- Output Display Area -->
            <section class="results-container" id="resultsContainer">
                <div class="result-box">
                    <span class="label">Celsius (°C)</span>
                    <span class="value" id="celsiusResult">--</span>
                </div>
                <div class="result-box">
                    <span class="label">Fahrenheit (°F)</span>
                    <span class="value" id="fahrenheitResult">--</span>
                </div>
                <div class="result-box">
                    <span class="label">Kelvin (K)</span>
                    <span class="value" id="kelvinResult">--</span>
                </div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
